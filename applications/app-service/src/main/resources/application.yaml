server:
  port: 8080
spring:
  application:
    name: "franchising-project"
  devtools:
    add-properties: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${FLYWAY_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:franchising_db}}
    user: ${USER_DATABASE}
    password: ${PASS_DATABASE}
    baseline-on-migrate: true
  r2dbc:
    url: ${URL_DATABASE}
    username: ${USER_DATABASE}
    password: ${PASS_DATABASE}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
